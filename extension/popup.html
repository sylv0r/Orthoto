<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Orthoto</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <strong>Orthoto</strong>
    <span id="status" aria-live="polite"></span>
  </header>

  <div class="row">
    <span>Language</span>
    <div class="toggle" role="group" aria-label="Language">
      <button type="button" data-lang="auto" title="French/English detection">Auto</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
  <label class="row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled">
  </label>
  <label class="row" id="site-row" hidden>
    <span>On <b id="site"></b></span>
    <input type="checkbox" id="site-enabled">
  </label>

  <details id="server-box">
    <summary>Server</summary>
    <form id="server-form">
      <label>URL <input id="server" type="url" required placeholder="https://orthoto.example.com"></label>
      <label>Username <input id="user" required autocomplete="username"></label>
      <label>Password <input id="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Save and test</button>
    </form>
  </details>
</body>
</html>
