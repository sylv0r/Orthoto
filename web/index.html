<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orthoto</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <div class="bar">
      <div class="toggle" role="group" aria-label="Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <span id="status" aria-live="polite"></span>
    </div>

    <textarea id="input" lang="fr" autofocus spellcheck="false"
      placeholder="Paste your text here… Enter to correct, Shift+Enter for a new line."></textarea>

    <div class="bar">
      <button type="button" id="correct" class="primary">Correct</button>
      <button type="button" id="copy" disabled>Copy</button>
    </div>

    <div id="output" class="box" lang="fr" aria-label="Corrected text"></div>
    <p class="hint">Click a correction to cycle through the alternatives, then back to the original text.</p>
  </main>
</body>
</html>
