worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nodelay on;

  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  client_max_body_size 1m;
  client_body_buffer_size 1m;

  gzip on;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css;

  # No upstream keepalive: LanguageTool's Java HTTP server adds ~45 ms per request
  # on reused connections (Nagle / delayed ACK), vs ~2 ms with a fresh loopback connection.
  upstream languagetool {
    server 127.0.0.1:8010;
  }

  server {
    listen 8080;

    auth_basic "Orthoto";
    auth_basic_user_file /tmp/htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    root /srv;

    location / {
      expires epoch;
      try_files $uri /index.html;
    }

    location /v2/ {
      proxy_pass http://languagetool;
      proxy_set_header Authorization "";
      proxy_read_timeout 60s;
    }
  }
}
