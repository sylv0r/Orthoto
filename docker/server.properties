# Without pipeline caching, French costs ~800 ms per request (pipeline rebuilt each time).
pipelineCaching=true
pipelineExpireTimeInSeconds=31536000
maxPipelinePoolSize=4
# Prewarming would load every registered language; the entrypoint warms up FR/EN only.
pipelinePrewarming=false
# Per-sentence result cache: already-checked sentences come back in a few ms.
cacheSize=2000
maxCheckThreads=4
maxTextLength=100000
